name: flipto-image
# Publishes the Flip-to fork's image on every push to flipto/main:
#   ghcr.io/flip-to/bigquery-emulator:flipto          (moving)
#   ghcr.io/flip-to/bigquery-emulator:flipto-<sha7>   (pinned)
on:
  push:
    branches:
      - flipto/main
  workflow_dispatch:
env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=flipto
            type=sha,prefix=flipto-,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Restore Go caches
        uses: actions/cache@v4
        id: go-cache
        with:
          path: ${{ runner.temp }}/go-cache
          key: image-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-${{ hashFiles('go.sum') }}-
            image-go-

      - name: Seed BuildKit Go cache mounts
        run: .github/scripts/go-cache-mounts.sh inject "${{ runner.temp }}/go-cache"

      # Only flipto/main publishes; dispatch from other refs builds without
      # pushing so the moving :flipto tag is never overwritten.
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/flipto/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/flipto/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flipto-image
          cache-to: type=gha,mode=max,scope=flipto-image
          build-args: |
            VERSION=flipto-${{ github.sha }}
            REVISION=${{ github.sha }}

      # Runs before actions/cache's post step, which saves the directory.
      # An exact key hit is not re-saved, so skip the copy then.
      - name: Extract BuildKit Go cache mounts
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: .github/scripts/go-cache-mounts.sh extract "${{ runner.temp }}/go-cache"
