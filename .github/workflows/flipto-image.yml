name: flipto-image
# Publishes the Flip-to fork's image on every push to flipto/main:
#   ghcr.io/flip-to/bigquery-emulator:flipto          (moving)
#   ghcr.io/flip-to/bigquery-emulator:flipto-<sha7>   (pinned)
on:
  push:
    branches:
      - flipto/main
  workflow_dispatch:
env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=flipto
            type=sha,prefix=flipto-,format=short

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=flipto-${{ github.sha }}
            REVISION=${{ github.sha }}
