name: flipto-image
# Publishes the Flip-to fork's image on every push to flipto/main:
#   ghcr.io/flip-to/bigquery-emulator:flipto          (moving)
#   ghcr.io/flip-to/bigquery-emulator:flipto-<sha7>   (pinned)
on:
  push:
    branches:
      - flipto/main
  workflow_dispatch:
env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=flipto
            type=sha,prefix=flipto-,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Restore Go caches
        uses: actions/cache@v4
        id: go-cache
        with:
          path: |
            go-mod
            go-build
          key: image-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-${{ hashFiles('go.sum') }}-
            image-go-

      # The type=gha cache exports layers only, not RUN --mount=type=cache
      # contents. Inject the restored dirs into BuildKit's cache mounts and
      # extract them again after the build so actions/cache saves them.
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "go-mod": "/go/pkg/mod",
              "go-build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      # Only flipto/main publishes; dispatch from other refs builds without
      # pushing so the moving :flipto tag is never overwritten.
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/flipto/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/flipto/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flipto-image
          cache-to: type=gha,mode=max,scope=flipto-image
          build-args: |
            VERSION=flipto-${{ github.sha }}
            REVISION=${{ github.sha }}
