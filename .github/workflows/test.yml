name: build and test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest" ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: download modules
      run: |
        go mod download
    - name: build
      run: make emulator/build
      env:
        VERSION: test
    - name: show version
      run: |
        ./bigquery-emulator --version
    - name: show linking info
      if: runner.os == 'Linux'
      run: |
        ldd bigquery-emulator || true
  test:
    needs: build
    name: Test
    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest" ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: download modules
      run: |
        go mod download
    - name: test
      # test/e2e is the Docker-based conformance suite; it runs in its own
      # integration workflow, not in the unit test job.
      run: |
        # shellcheck disable=SC2046 # word splitting of the package list is intended
        go test -v -count=1 $(go list ./... | grep -v '/test/e2e')
